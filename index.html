<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nossa Cafeteria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: uma tela só. Cabeçalho de giz, a cafeteria isométrica no meio, barra de ações embaixo, gaveta lateral para decorar. */
  --night:#1e2238; --panel:#2a2f4b; --line:#3d4369; --chalk:#f4f0e4; --muted:#aab0cc;
  --butter:#f6c96b; --rose:#ef8f9c; --sage:#8fbfa6;
  --display:"Patrick Hand","Comic Sans MS",cursive;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--night);color:var(--chalk);font-family:var(--body);font-weight:500;font-size:15px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;flex-wrap:wrap}
#nameBtn{font-family:var(--display);font-size:30px;line-height:1.1;padding:2px 6px;border-radius:8px;border-bottom:2px dashed var(--line);text-align:left}
#nameBtn:hover{border-bottom-color:var(--butter)}
#nameInput{font-family:var(--display);font-size:28px;background:var(--panel);color:var(--chalk);border:2px solid var(--butter);border-radius:8px;padding:2px 8px;width:min(320px,70vw)}
.stats{display:flex;gap:8px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;display:flex;align-items:center;gap:8px;font-weight:800;font-variant-numeric:tabular-nums}
.pill small{font-weight:500;color:var(--muted)}
.coin{width:14px;height:14px;border-radius:50%;background:var(--butter);box-shadow:inset -2px -2px 0 rgba(0,0,0,.18)}
main{display:flex;min-height:0}
#stage{flex:1;min-width:0;min-height:0;position:relative;background:radial-gradient(ellipse at 50% 60%,#2e3357 0%,var(--night) 70%)}
#room{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#toast{position:absolute;left:50%;top:12px;transform:translate(-50%,-8px);max-width:min(440px,calc(100% - 32px));background:var(--chalk);color:#2a2540;padding:10px 16px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#placebar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--butter);border-radius:14px;padding:8px 8px 8px 14px;max-width:calc(100% - 32px)}
#panel{width:330px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:6px;padding:10px 12px 0}
.tab{flex:1;padding:8px 4px;font-size:14px;border-radius:10px 10px 0 0;font-weight:800;color:var(--muted);border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--chalk);border-bottom-color:var(--butter)}
.tabx{flex:0 0 auto;padding:8px 6px;font-size:14px;color:var(--muted);font-weight:800}
#panelBody{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
h2{font-family:var(--display);font-size:22px;font-weight:400;margin:8px 0 0}
.row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:6px 8px}
.row canvas{width:56px;height:56px;flex:0 0 56px;background:rgba(255,255,255,.05);border-radius:8px}
.row .nm{flex:1;min-width:0;font-weight:700}
.row .nm small{display:block;font-weight:500;color:var(--muted)}
.btn{background:var(--butter);color:#2a2540;font-weight:800;border-radius:10px;padding:8px 12px;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{background:var(--line);color:var(--muted);cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--chalk);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--chalk)}
.btn.ghost[aria-pressed="true"]{border-color:var(--sage);color:var(--sage)}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:38px;height:38px;border-radius:50%;border:3px solid var(--line)}
.sw button[aria-pressed="true"]{border-color:var(--chalk)}
.recipe{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.recipe b{display:flex;justify-content:space-between}
.recipe span{color:var(--muted);font-size:14px}
.recipe.locked{opacity:.6}
footer{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap;border-top:1px solid var(--line)}
#orderBtn{flex:1 1 220px;padding:12px 16px;font-size:16px}
.overlay{position:fixed;inset:0;background:rgba(20,22,40,.72);display:grid;place-items:center;padding:16px;z-index:5}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;width:min(640px,100%);max-height:100%;overflow:auto;display:grid;gap:14px}
.card h1{font-family:var(--display);font-weight:400;font-size:30px;margin:0;text-wrap:balance}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;color:var(--muted)}
.chip.done{background:var(--sage);border-color:var(--sage);color:#1e2238;font-weight:700}
.chip.now{border-color:var(--butter);color:var(--butter);font-weight:700}
.brewgrid{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.cupwrap{position:relative;width:118px;margin:0 auto}
.cupwrap::after{content:"";position:absolute;right:-26px;top:28px;width:30px;height:54px;border:6px solid var(--chalk);border-left:0;border-radius:0 24px 24px 0}
.cup{height:140px;border:5px solid var(--chalk);border-top-width:2px;border-radius:6px 6px 34px 34px;display:flex;flex-direction:column-reverse;overflow:hidden;background:rgba(255,255,255,.05)}
.layer{height:0;transition:height .7s ease;display:grid;place-items:center;color:#b7794a;font-size:13px;line-height:1;flex:0 0 auto}
.stations{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{position:relative;overflow:hidden;background:rgba(255,255,255,.05);border:2px solid var(--line);border-radius:12px;padding:10px;font-weight:700;text-align:left}
.st:hover{border-color:var(--muted)}
.st.next{border-color:var(--butter);box-shadow:0 0 0 3px rgba(246,201,107,.18)}
.st.working::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--butter);transform-origin:left;animation:fill .85s linear}
.st.no{animation:shake .3s}
.arts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.arts button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);font-size:20px;color:var(--rose)}
.arts button:disabled{opacity:.35;cursor:default}
.arts button:not(:disabled){border-color:var(--butter)}
#hint{min-height:1.4em;color:var(--butter);font-weight:700}
.cardfoot{display:flex;justify-content:space-between;gap:8px}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
html{-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text}
header{padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left))}
footer{padding:10px max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#panel{padding-right:env(safe-area-inset-right)}
@media (max-width:760px){
  main{flex-direction:column}
  header{flex-wrap:nowrap;gap:8px}
  .pill{padding:5px 10px}.lg{display:none}
  footer{gap:6px}#orderBtn{flex:1 1 100%}footer .ghost{flex:1;padding:11px 4px;font-size:13px}
  .card{padding:14px;gap:10px}.card h1{font-size:24px}
  .st{padding:12px 10px}
  #panel{padding-right:0;padding-bottom:0}
  #panel{width:auto;height:46%;border-left:0;border-top:1px solid var(--line)}
  #nameBtn{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
  .brewgrid{grid-template-columns:1fr}
  .cup{height:110px}
}
@media (prefers-reduced-motion:reduce){.st.working::after,.st.no{animation:none}.layer,#toast{transition:none}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e2238">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cafeteria">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
</head>
<body>
<div id="app">
  <header>
    <div>
      <button id="nameBtn" title="Trocar o nome da cafeteria"></button>
      <input id="nameInput" maxlength="24" aria-label="Nome da cafeteria" hidden>
    </div>
    <div class="stats">
      <div class="pill" title="Moedas"><span class="coin"></span><span id="coins">0</span></div>
      <div class="pill"><span id="served">0</span><small><span class="lg">bebidas </span>servidas</small></div>
    </div>
  </header>
  <main>
    <div id="stage">
      <canvas id="room" role="img" aria-label="Vista isométrica da cafeteria"></canvas>
      <div id="toast" role="status"></div>
      <div id="placebar" hidden><span id="placeText"></span><button class="btn ghost" id="placeCancel">Guardar</button></div>
    </div>
    <aside id="panel" hidden>
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="deco">Decoração</button>
        <button class="tab" role="tab" data-tab="menu">Cardápio</button>
        <button class="tab" role="tab" data-tab="gente">Clientes</button>
        <button class="tabx" id="panelClose" aria-label="Fechar painel">Fechar</button>
      </div>
      <div id="panelBody"></div>
    </aside>
  </main>
  <footer>
    <button class="btn" id="orderBtn" disabled>Aguardando o próximo cliente</button>
    <button class="btn ghost" id="decoBtn">Decorar</button>
    <button class="btn ghost" id="menuBtn">Cardápio</button>
    <button class="btn ghost" id="musicBtn" aria-pressed="false">Música</button>
    <button class="btn ghost" id="rainBtn" aria-pressed="false">Chuva</button>
  </footer>
</div>

<div class="overlay" id="brew" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="brewTitle">
    <h1 id="brewTitle"></h1>
    <div class="chips" id="chips"></div>
    <div class="brewgrid">
      <div class="cupwrap"><div class="cup" id="cup"></div></div>
      <div style="display:grid;gap:10px">
        <div class="stations" id="stations"></div>
        <div class="arts" id="arts"><span>Desenho:</span>
          <button data-art="♥" aria-label="Coração">♥</button>
          <button data-art="✿" aria-label="Flor">✿</button>
          <button data-art="★" aria-label="Estrela">★</button>
        </div>
      </div>
    </div>
    <div id="hint" role="status"></div>
    <div class="cardfoot">
      <button class="btn ghost" id="brewBack">Voltar</button>
      <button class="btn" id="brewDone" disabled>Entregar para o cliente</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';
const N=8, TW=40, TH=20, WALL=150;
const $=id=>document.getElementById(id);
const KEY='nossa-cafeteria-v1';

const RECIPES=[
  {id:'espresso',nome:'Espresso',preco:6,steps:['moer','extrair'],at:0},
  {id:'cha',nome:'Chá',preco:5,steps:['agua','sache'],at:0},
  {id:'cappuccino',nome:'Cappuccino',preco:10,steps:['moer','extrair','leite','espuma'],at:0},
  {id:'latte',nome:'Latte',preco:11,steps:['moer','extrair','leite','arte'],at:0},
  {id:'mocha',nome:'Mocha',preco:13,steps:['moer','extrair','chocolate','leite','espuma'],at:6},
  {id:'chocolate',nome:'Chocolate quente',preco:9,steps:['chocolate','leite','espuma'],at:14},
  {id:'gelado',nome:'Café gelado',preco:12,steps:['gelo','moer','extrair','leite'],at:24}
];
const ST={
  moer:{nome:'Moer os grãos',curto:'Moer'},
  extrair:{nome:'Tirar o espresso',curto:'Espresso',cor:'#5a3524',h:28},
  agua:{nome:'Água quente',curto:'Água',cor:'#cfe3e6',h:62},
  sache:{nome:'Sachê de chá',curto:'Chá',tinge:'#c98d52'},
  leite:{nome:'Leite vaporizado',curto:'Leite',cor:'#f0dcc0',h:34},
  espuma:{nome:'Espuma de leite',curto:'Espuma',cor:'#fffaf0',h:16},
  chocolate:{nome:'Calda de chocolate',curto:'Chocolate',cor:'#3b2218',h:14},
  gelo:{nome:'Gelo',curto:'Gelo',cor:'#dcf1f9',h:22},
  arte:{nome:'Desenho na espuma',curto:'Desenho'}
};
const SHOP=[
  {id:'planta',nome:'Planta',preco:15},
  {id:'samambaia',nome:'Costela-de-adão',preco:25},
  {id:'puff',nome:'Pufe',preco:14},
  {id:'flores',nome:'Mesinha com flores',preco:18},
  {id:'tapete',nome:'Tapete',preco:20,flat:true},
  {id:'luminaria',nome:'Luminária',preco:30},
  {id:'poltrona',nome:'Poltrona',preco:35},
  {id:'mesa',nome:'Mesa com banquinhos',preco:40,nota:'Mais 2 lugares'},
  {id:'vitrola',nome:'Vitrola',preco:38,nota:'Solta notas com a música ligada'},
  {id:'estante',nome:'Estante de livros',preco:45},
  {id:'gato',nome:'Caminha com gatinho',preco:60,max:1,nota:'Ele passeia pela loja'},
  {id:'bandeirinhas',nome:'Bandeirinhas',preco:16,wall:true,v:128},
  {id:'quadro',nome:'Quadro',preco:18,wall:true,v:92},
  {id:'pendente',nome:'Planta pendente',preco:20,wall:true,v:112},
  {id:'relogio',nome:'Relógio',preco:20,wall:true,v:100},
  {id:'luzinhas',nome:'Luzinhas',preco:22,wall:true,v:132},
  {id:'prateleira',nome:'Prateleira de xícaras',preco:26,wall:true,v:86}
];
const DEFS=Object.fromEntries(SHOP.map(s=>[s.id,s]));
const WALLS={sage:'#a9cdb9',rose:'#efbcb8',sky:'#aecbe6',butter:'#f1dca4',lilac:'#cbbbe6'};
const WALL_NAMES={sage:'Verde sálvia',rose:'Rosa',sky:'Azul céu',butter:'Amarelo manteiga',lilac:'Lilás'};
const FLOORS={wood:['#d8ab7c','#cf9f70'],xadrez:['#f1e6d2','#9cc4b5'],escuro:['#7c5c4b','#705140']};
const FLOOR_NAMES={wood:'Madeira clara',xadrez:'Xadrez',escuro:'Madeira escura'};
const NOTES=[
  'Passei só para te ver. O café foi a desculpa.',
  'O melhor lugar da cidade é onde você está.',
  'Seu café deixa meu dia mais leve.',
  'Volto amanhã. E depois de amanhã também.'
];
const REGS=[
  {nome:'Dona Lúcia',fav:'cha',skin:'#f6d2b8',hair:'#d9d5d0',shirt:'#cbbbe6',long:false,falas:['Esse cantinho me lembra a cozinha da minha mãe.','Trouxe meu tricô hoje, vou ficar um tempinho.','Com chuva, chá fica ainda melhor.']},
  {nome:'Téo',fav:'espresso',skin:'#c98d62',hair:'#2a2540',shirt:'#9db7e0',long:false,falas:['Prova amanhã. Preciso de café e coragem.','Passei na prova! Esse espresso dá sorte.','Posso estudar naquela mesa de novo?']},
  {nome:'Marina',fav:'latte',skin:'#e9b98f',hair:'#8a4b3a',shirt:'#f6c96b',long:true,falas:['Estou escrevendo um livro. O capítulo 3 nasceu aqui.','O desenho na espuma é a melhor parte do meu dia.','Hoje a história andou. Deve ser o café.']},
  {nome:'Seu Jorge',fav:'cappuccino',skin:'#9b6a48',hair:'#f3efe3',shirt:'#8fbfa6',long:false,falas:['No meu tempo, cappuccino era só no domingo.','Vou deixar o jornal aqui para o próximo.','Esse é o melhor cappuccino do bairro.']},
  {nome:'Bia',fav:'mocha',skin:'#fbe0cc',hair:'#3a2c3f',shirt:'#e39a6b',long:true,falas:['Chocolate com café foi a melhor invenção.','Vim desenhar a cafeteria. Posso?','Terminei o desenho. Ficou a sua cara.']}
];
const DEF_STATE=()=>({coins:40,reg:{},served:0,count:0,name:'Nossa Cafeteria',wall:'sage',floor:'wood',
  items:[{id:'mesa',x:5,y:3},{id:'mesa',x:5,y:6},{id:'planta',x:7,y:0}],
  wallItems:[{id:'quadro',side:'L',t:2}],stock:{}});

let S=DEF_STATE();
function adopt(d){
  if(!d||typeof d!=='object')return;
  const b=DEF_STATE();
  S={...b,...d,items:Array.isArray(d.items)?d.items.filter(i=>DEFS[i.id]&&!DEFS[i.id].wall):b.items,
     wallItems:Array.isArray(d.wallItems)?d.wallItems.filter(i=>DEFS[i.id]&&DEFS[i.id].wall):b.wallItems,stock:d.stock||{}};
  if(!WALLS[S.wall])S.wall='sage'; if(!FLOORS[S.floor])S.floor='wood';
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- canvas helpers ---------- */
const cv=$('room'); let ctx=cv.getContext('2d'); let musicOn=false;
let dpr=1, view={s:1,tx:0,ty:0}, now=0;
const P=(x,y,z=0)=>[(x-y)*TW,(x+y)*TH-z];
function shade(h,f){const n=parseInt(h.slice(1),16);const c=v=>Math.max(0,Math.min(255,v*f))|0;return `rgb(${c(n>>16&255)},${c(n>>8&255)},${c(n&255)})`;}
function poly(pts,fill){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();}
function bx(x,y,w,d,z0,z1,col){
  poly([P(x,y+d,z1),P(x+w,y+d,z1),P(x+w,y+d,z0),P(x,y+d,z0)],shade(col,.9));
  poly([P(x+w,y,z1),P(x+w,y+d,z1),P(x+w,y+d,z0),P(x+w,y,z0)],shade(col,.76));
  poly([P(x,y,z1),P(x+w,y,z1),P(x+w,y+d,z1),P(x,y+d,z1)],shade(col,1.08));
}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();}
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fill();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fill();}
function wallCtx(side,fn){ctx.save();ctx.transform(1,side==='R'?TH/TW:-TH/TW,0,1,0,0);fn(side==='R'?1:-1);ctx.restore();}
const shadow=(x,y,rx=12,ry=6)=>{ctx.fillStyle='rgba(30,25,50,.16)';ell(x,y,rx,ry);};

/* ---------- item art ---------- */
const G1='#5fa37a',G2='#7dbb8e';
const ITEM={
  planta(cx,cy){const p=P(cx,cy);shadow(p[0],p[1]);bx(cx-.16,cy-.16,.32,.32,0,12,'#d98a6a');const [x,y]=P(cx,cy,12);ctx.fillStyle=G1;circ(x-6,y-7,8);circ(x+6,y-8,8);ctx.fillStyle=G2;circ(x,y-15,9);},
  samambaia(cx,cy){const p=P(cx,cy);shadow(p[0],p[1],14,7);bx(cx-.18,cy-.18,.36,.36,0,14,'#e8dcc8');const [x,y]=P(cx,cy,14);
    [-1,-.5,0,.5,1].forEach((a,i)=>{ctx.save();ctx.translate(x,y);ctx.rotate(a*.8);ctx.fillStyle=i%2?G2:G1;ell(0,-22,7,22);ctx.restore();});},
  luminaria(cx,cy){const [x,y]=P(cx,cy);shadow(x,y,9,4.5);ctx.fillStyle='#4a4660';ell(x,y,7,3.5);rr(x-1.5,y-58,3,58,1);
    poly([[x-7,y-76],[x+7,y-76],[x+12,y-56],[x-12,y-56]],'#f6c96b');
    const g=ctx.createRadialGradient(x,y-56,2,x,y-56,62);g.addColorStop(0,'rgba(255,220,140,.34)');g.addColorStop(1,'rgba(255,220,140,0)');ctx.fillStyle=g;circ(x,y-56,62);},
  tapete(cx,cy){const a=.47,b=.33;poly([P(cx-a,cy-a),P(cx+a,cy-a),P(cx+a,cy+a),P(cx-a,cy+a)],'#ef8f9c');

  const sitting={};custs.forEach(c=>{if(c.state==='sit')sitting[c.seat]=1;});
  for(const it of S.items){if(DEFS[it.id].flat)continue;const cx=it.x+.5,cy=it.y+.5;
    if(it.id==='mesa'){D.push({d:cx+cy-.67,f:()=>stool(cx-.62,cy)});D.push({d:cx+cy+.57,f:()=>stool(cx+.62,cy)});
      D.push({d:cx+cy,f:()=>{ITEM.mesa(cx,cy);['a','b'].forEach((s,j)=>{if(sitting[it.x+','+it.y+','+s]){const p=P(cx+(j?.16:-.16),cy,30);ctx.fillStyle='#f4f0e4';rr(p[0]-3.5,p[1]-7,7,7,1.5);}});}});}
    else D.push({d:cx+cy,f:()=>{ITEM[it.id](cx,cy);if(isPlant(it.id)&&dry.get(it)<=0)drop(cx,cy,it.id==='samambaia'?70:46);}});}
  for(const c of custs)D.push({d:c.x+c.y,f:()=>drawPerson(c,c.state==='sit')});
  if(cat.on)D.push({d:cat.x+cat.y+.01,f:()=>drawCat(cat.x,cat.y,cat.mode==='sleep'?'sleep':cat.mode==='sit'?'sit':'walk',cat.dir||1)});
  D.sort((a,b)=>a.d-b.d).forEach(o=>o.f());
  if(placing&&hover){const def=DEFS[placing.id];
    if(def.wall){if(hover.wall&&wallFree(hover.wall.side,hover.wall.t))drawWallItem({id:placing.id,...hover.wall},.7);}
    else if(hover.tile){const {x,y}=hover.tile,ok=tileFree(x,y,def.flat);poly([P(x,y),P(x+1,y),P(x+1,y+1),P(x,y+1)],ok?'rgba(143,191,166,.5)':'rgba(239,143,156,.5)');
      if(ok){ctx.globalAlpha=.75;ITEM[placing.id](x+.5,y+.5);if(placing.id==='mesa'){stool(x-.12,y+.5);stool(x+1.12,y+.5);}ctx.globalAlpha=1;}}}
  const f=front();
  if(f&&!placing){const [x,y]=P(f.x,f.y,62);ctx.font='15px "Patrick Hand",cursive';const lab=(f.reg?f.reg.nome+': ':'')+f.order.nome,w=ctx.measureText(lab).width+18;const by=y-24-2*Math.sin(now*2.5);
    ctx.fillStyle='#f4f0e4';rr(x-w/2,by,w,22,9);poly([[x-5,by+21],[x+5,by+21],[x,by+28]],'#f4f0e4');ctx.fillStyle='#2a2540';ctx.textAlign='center';ctx.fillText(lab,x,by+16);ctx.textAlign='start';}
  ctx.font='18px "Patrick Hand",cursive';ctx.textAlign='center';
  for(const p of parts){ctx.globalAlpha=Math.min(1,p.life);ctx.fillStyle=p.col;ctx.fillText(p.txt,p.x,p.y);}
  ctx.globalAlpha=1;ctx.textAlign='start';
}

/* ---------- loop ---------- */
let last=0,lastLabel='';
function tick(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;now=ts/1000;
  spawnT-=dt;const waiting=custs.filter(c=>c.state==='enter'||c.state==='queue').length;
  if(spawnT<=0){if(waiting<3)spawn();spawnT=7+Math.random()*7;}
  for(let i=custs.length-1;i>=0;i--){const c=custs[i],done=move(c,dt);
    if(c.state==='enter'&&done)c.state='queue';
    else if(c.state==='toSeat'&&done){c.state='sit';c.t=14+Math.random()*12;}
    else if(c.state==='sit'){c.t-=dt;if(c.t<=0){pop(c.x,c.y,58,'♥','#ef8f9c');sendOut(c);}}
    else if(c.state==='leave'&&done)custs.splice(i,1);}
  updCat(dt);updPlants(dt);
  for(let i=parts.length-1;i>=0;i--){parts[i].life-=dt;parts[i].y-=18*dt;if(parts[i].life<=0)parts.splice(i,1);}
  const f=front(),lab=f?'Preparar pedido: '+f.order.nome:'Aguardando o próximo cliente';
  if(lab!==lastLabel){lastLabel=lab;$('orderBtn').textContent=lab;$('orderBtn').disabled=!f;}
  draw();requestAnimationFrame(tick);}

/* ---------- HUD, toast ---------- */
function hud(){$('coins').textContent=S.coins;$('served').textContent=S.served;$('nameBtn').textContent=S.name;}
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),6500);}

/* ---------- brew ---------- */
let brew=null;
function openBrew(c){if(!c)return;brew={c,r:c.order,i:0,busy:false,art:false};$('cup').innerHTML='';$('brewTitle').textContent='Pedido: '+c.order.nome;
  $('stations').innerHTML=Object.keys(ST).filter(k=>k!=='arte').map(k=>`<button class="st" data-st="${k}">${ST[k].nome}</button>`).join('');
  $('brew').hidden=false;renderBrew();}
function renderBrew(msg){const {r,i}=brew,cur=r.steps[i];
  $('chips').innerHTML=r.steps.map((s,j)=>`<span class="chip ${j<i?'done':j===i?'now':''}">${j+1}. ${ST[s].curto}</span>`).join('');
  document.querySelectorAll('#stations .st').forEach(b=>b.classList.toggle('next',b.dataset.st===cur));
  document.querySelectorAll('#arts button').forEach(b=>b.disabled=cur!=='arte');
  $('arts').style.display=r.steps.includes('arte')?'':'none';
  $('brewDone').disabled=i<r.steps.length;
  $('hint').textContent=msg||(cur?(cur==='arte'?'Agora escolha o desenho na espuma.':'Próximo passo: '+ST[cur].nome+'.'):'Prontinho! Pode entregar.');}
function addLayer(cor,h,txt){const d=document.createElement('div');d.className='layer';d.style.background=cor;d.textContent=txt||'';$('cup').appendChild(d);requestAnimationFrame(()=>requestAnimationFrame(()=>d.style.height=h+'%'));}
$('stations').addEventListener('click',e=>{const b=e.target.closest('.st');if(!b||!brew||brew.busy)return;const cur=brew.r.steps[brew.i];
  if(!cur)return;
  if(b.dataset.st!==cur){b.classList.remove('no');void b.offsetWidth;b.classList.add('no');renderBrew(cur==='arte'?'Falta só o desenho na espuma.':'Quase! Agora é: '+ST[cur].nome+'.');return;}
  brew.busy=true;b.classList.add('working');const st=ST[cur];
  setTimeout(()=>{if(!brew)return;b.classList.remove('working');if(st.cor)addLayer(st.cor,st.h);
    if(st.tinge){const l=$('cup').lastElementChild;if(l)l.style.background=st.tinge;}
    brew.i++;brew.busy=false;renderBrew(cur==='moer'?'Hum, que cheirinho de café moído. Agora: '+ST[brew.r.steps[brew.i]].nome+'.':'');},850);});
$('arts').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!brew||brew.busy||brew.r.steps[brew.i]!=='arte')return;
  addLayer('#fffaf0',13,b.dataset.art);brew.art=true;brew.i++;renderBrew();});
function closeBrew(){$('brew').hidden=true;brew=null;}
$('brewBack').onclick=closeBrew;
$('brewDone').onclick=()=>{const b=brew;closeBrew();if(custs.includes(b.c)&&b.c.state==='queue')serve(b.c,b.r,b.art);};
$('orderBtn').onclick=()=>openBrew(front());

/* ---------- panel / shop ---------- */
let tab='deco',placing=null,hover=null,resetArmed=false;
const owned=id=>S.items.concat(S.wallItems).filter(i=>i.id===id).length+(S.stock[id]||0)+(placing&&placing.id===id?1:0);
function renderPanel(){document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===tab));
  const b=$('panelBody');
  if(tab==='menu'){b.innerHTML='<h2>Cardápio</h2>'+RECIPES.map(r=>{const ok=S.served>=r.at;
      return `<div class="recipe ${ok?'':'locked'}"><b><span style="color:inherit;font-size:inherit">${r.nome}</span><span>${r.preco} moedas</span></b><span>${ok?r.steps.map(s=>ST[s].curto).join(' → '):'Libera com '+r.at+' bebidas servidas'}</span></div>`;}).join('');return;}
  if(tab==='gente'){b.innerHTML='<h2>Clientes da casa</h2>'+REGS.map(r=>{const v=S.reg[r.nome]||0,fav=RECIPES.find(k=>k.id===r.fav).nome;
      return `<div class="recipe ${v?'':'locked'}"><b><span style="color:inherit;font-size:inherit">${v?r.nome:'Ainda não apareceu'}</span><span>${v?v+(v===1?' visita':' visitas'):''}</span></b><span>${v?'Bebida favorita: '+fav+'. “'+r.falas[(v-1)%r.falas.length]+'”':'Continue servindo para conhecer mais gente.'}</span></div>`;}).join('');return;}
  const row=s=>{const st=S.stock[s.id]||0,full=s.max&&owned(s.id)>=s.max&&!st;
    const lab=st?`Colocar (${st})`:full?'Já é seu':`${s.preco} moedas`;
    return `<div class="row"><canvas data-pv="${s.id}" width="56" height="56"></canvas><div class="nm">${s.nome}${s.nota?`<small>${s.nota}</small>`:''}</div><button class="btn" data-buy="${s.id}" ${(!st&&(full||S.coins<s.preco))?'disabled':''}>${lab}</button></div>`;};
  b.innerHTML='<h2>Para o salão</h2>'+SHOP.filter(s=>!s.wall).map(row).join('')+'<h2>Para as paredes</h2>'+SHOP.filter(s=>s.wall).map(row).join('')+
    '<h2>Cor da parede</h2><div class="sw">'+Object.keys(WALLS).map(k=>`<button data-wall="${k}" style="background:${WALLS[k]}" aria-label="${WALL_NAMES[k]}" aria-pressed="${S.wall===k}"></button>`).join('')+'</div>'+
    '<h2>Piso</h2><div class="sw">'+Object.keys(FLOORS).map(k=>`<button data-floor="${k}" style="background:linear-gradient(135deg,${FLOORS[k][0]} 50%,${FLOORS[k][1]} 50%)" aria-label="${FLOOR_NAMES[k]}" aria-pressed="${S.floor===k}"></button>`).join('')+'</div>'+
    '<p style="color:var(--muted);margin:8px 0 0">Com este painel aberto, toque em um móvel da cafeteria para mudar de lugar.</p>'+
    `<button class="btn ghost" data-reset="1" style="margin-top:8px">${resetArmed?'Toque de novo para apagar tudo':'Recomeçar do zero'}</button>`;
  b.querySelectorAll('canvas[data-pv]').forEach(preview);}
function preview(c){const id=c.dataset.pv,main=ctx;c.width=c.height=56*dpr;ctx=c.getContext('2d');
  if(DEFS[id].wall){ctx.setTransform(dpr*.95,0,0,dpr*.95,dpr*28,dpr*(id==='luzinhas'?26:28));WITEM[id](0,0);}
  else{const k=dpr*(id==='estante'||id==='luminaria'?.56:.7);ctx.setTransform(k,0,0,k,dpr*28,dpr*46);ctx.translate(0,-20);
    if(id==='mesa'){stool(-.12,.5);ITEM.mesa(.5,.5);stool(1.12,.5);}else ITEM[id](.5,.5);if(id==='gato')drawCat(.5,.5,'sleep',1);}
  ctx=main;}
function openPanel(t){tab=t;$('panel').hidden=false;resetArmed=false;renderPanel();}
function closePanel(){cancelPlacing();$('panel').hidden=true;}
function setPlacing(id){placing=id?{id}:null;$('placebar').hidden=!placing;
  if(placing)$('placeText').textContent=(DEFS[id].wall?'Toque em um ponto da parede para pendurar: ':'Toque em um lugar livre para colocar: ')+DEFS[id].nome;}
function cancelPlacing(){if(!placing)return;S.stock[placing.id]=(S.stock[placing.id]||0)+1;setPlacing(null);save();if(!$('panel').hidden)renderPanel();}
$('placeCancel').onclick=cancelPlacing;
$('panel').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.tab){tab=d.tab;resetArmed=false;if(tab!=='deco')cancelPlacing();renderPanel();}
  else if(d.buy){cancelPlacing();const s=DEFS[d.buy];if(S.stock[s.id]>0)S.stock[s.id]--;else if(S.coins>=s.preco)S.coins-=s.preco;else return;setPlacing(s.id);hud();save();renderPanel();}
  else if(d.wall){S.wall=d.wall;save();renderPanel();}
  else if(d.floor){S.floor=d.floor;save();renderPanel();}
  else if(d.reset){if(!resetArmed){resetArmed=true;renderPanel();return;}S=DEF_STATE();custs.length=0;cat.on=false;setPlacing(null);resetArmed=false;save();hud();renderPanel();toast('Cafeteria nova em folha.');}});
$('panelClose').onclick=closePanel;
$('decoBtn').onclick=()=>(!$('panel').hidden&&tab==='deco')?closePanel():openPanel('deco');
$('menuBtn').onclick=()=>{cancelPlacing();(!$('panel').hidden&&tab==='menu')?closePanel():openPanel('menu');};

/* ---------- pointer ---------- */
const R=b=>b/Math.min(1,view.s*1.15);
function target(e){const r=cv.getBoundingClientRect();const wx=(e.clientX-r.left-view.tx)/view.s,wy=(e.clientY-r.top-view.ty)/view.s;
  const gx=(wx/TW+wy/TH)/2,gy=(wy/TH-wx/TW)/2,tx=Math.floor(gx),ty=Math.floor(gy);let wall=null,best=46;
  for(const side of['L','R'])for(let t=0;t<N;t++){const p=side==='L'?P(0,t+.5,100):P(t+.5,0,100);const d=Math.hypot(p[0]-wx,p[1]-wy);if(d<best){best=d;wall={side,t};}}
  return{wx,wy,tile:tx>=0&&ty>=0&&tx<N&&ty<N?{x:tx,y:ty}:null,wall};}
cv.addEventListener('pointermove',e=>{hover=target(e);});
cv.addEventListener('pointerleave',()=>{hover=null;});
cv.addEventListener('click',e=>{const t=target(e);hover=t;
  if(placing){const def=DEFS[placing.id];
    if(def.wall){if(t.wall&&wallFree(t.wall.side,t.wall.t)){S.wallItems.push({id:placing.id,...t.wall});setPlacing(null);}else return toast('Escolha um ponto livre na parede (as bolinhas claras).');}
    else{if(t.tile&&tileFree(t.tile.x,t.tile.y,def.flat)){S.items.push({id:placing.id,...t.tile});setPlacing(null);}else return toast('Esse lugar está ocupado. Escolha um piso com a marca clara.');}
    save();renderPanel();return;}
  if(!$('panel').hidden&&tab==='deco'){
    let hit=null,best=R(30);for(const it of S.items){if(DEFS[it.id].flat)continue;const p=P(it.x+.5,it.y+.5,18);const d=Math.hypot(p[0]-t.wx,p[1]-t.wy);if(d<best){best=d;hit=it;}}
    if(!hit&&t.tile)hit=S.items.find(i=>i.x===t.tile.x&&i.y===t.tile.y);
    if(hit){S.items.splice(S.items.indexOf(hit),1);checkSeats();setPlacing(hit.id);save();renderPanel();return;}
    if(t.wall){const w=S.wallItems.find(i=>i.side===t.wall.side&&i.t===t.wall.t);if(w){S.wallItems.splice(S.wallItems.indexOf(w),1);setPlacing(w.id);save();renderPanel();}}
    return;}
  const f=front();if(f){const p=P(f.x,f.y,40);if(Math.hypot(p[0]-t.wx,p[1]-t.wy)<R(34))return openBrew(f);}
  for(const it of S.items)if(isPlant(it.id)&&dry.get(it)<=0){const p=P(it.x+.5,it.y+.5,30);if(Math.hypot(p[0]-t.wx,p[1]-t.wy)<R(36)){dry.set(it,60+Math.random()*60);S.coins+=2;pop(it.x+.5,it.y+.5,52,'+2','#8fbfa6');hud();save();return;}}
  if(cat.on){const p=P(cat.x,cat.y,8);if(Math.hypot(p[0]-t.wx,p[1]-t.wy)<R(22))pop(cat.x,cat.y,24,'♥','#ef8f9c');}});
addEventListener('keydown',e=>{if(e.key==='Escape'){if(brew)closeBrew();else cancelPlacing();}});

/* ---------- name ---------- */
$('nameBtn').onclick=()=>{const i=$('nameInput');i.value=S.name;$('nameBtn').hidden=true;i.hidden=false;i.focus();i.select();};
function commitName(){const i=$('nameInput');if(i.hidden)return;S.name=i.value.trim().slice(0,24)||'Nossa Cafeteria';i.hidden=true;$('nameBtn').hidden=false;hud();save();}
$('nameInput').addEventListener('blur',commitName);
$('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')commitName();});

/* ---------- sound: rain + music ---------- */
let actx,gain,rainOn=false,mGain,musicT=null,beatN=0;
function audio(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();return actx;}
$('rainBtn').onclick=()=>{try{audio();
  if(!gain){const len=actx.sampleRate*3,buf=actx.createBuffer(1,len,actx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;const src=actx.createBufferSource();src.buffer=buf;src.loop=true;
    const hp=actx.createBiquadFilter();hp.type='highpass';hp.frequency.value=700;const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5200;
    gain=actx.createGain();gain.gain.value=0;src.connect(hp);hp.connect(lp);lp.connect(gain);gain.connect(actx.destination);src.start();}
  rainOn=!rainOn;gain.gain.linearRampToValueAtTime(rainOn?.07:0,actx.currentTime+.6);$('rainBtn').setAttribute('aria-pressed',rainOn);
}catch(err){toast('Não foi possível tocar o som neste navegador.');}};
const CHORDS=[[57,60,64,67],[53,57,60,64],[48,52,55,59],[55,59,62,64]];
function tone(m,t,d,v,type){const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(m-69)/12);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(mGain);o.start(t);o.stop(t+d+.05);}
function beat(){const t=actx.currentTime+.06,ch=CHORDS[(beatN>>2)%4],i=beatN%4;
  if(i===0)tone(ch[0]-12,t,2.6,.11,'sine');
  tone(ch[[0,2,1,3][i]]+(Math.random()<.3?12:0),t,1.5,.07,'triangle');
  if(Math.random()<.25)tone(ch[Math.random()*4|0]+12,t+.32,1.1,.04,'sine');
  beatN++;}
$('musicBtn').onclick=()=>{try{audio();
  if(!mGain){mGain=actx.createGain();mGain.gain.value=.8;const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1800;mGain.connect(lp);lp.connect(actx.destination);}
  musicOn=!musicOn;clearInterval(musicT);if(musicOn){beat();musicT=setInterval(beat,640);}$('musicBtn').setAttribute('aria-pressed',musicOn);
}catch(err){toast('Não foi possível tocar a música neste navegador.');}};

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&actx&&(rainOn||musicOn)){try{actx.resume();}catch(e){}}});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- boot ---------- */
function resize(){const r=$('stage').getBoundingClientRect();dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);
  const H=WALL+2*N*TH+40;view.s=Math.min(r.width/(2*N*TW+(r.width<500?6:40)),r.height/H);view.tx=r.width/2;view.ty=(r.height-H*view.s)/2+(WALL+14)*view.s;}
function start(data){
  if(data&&data.state)adopt(data.state);else{try{adopt(JSON.parse(localStorage.getItem(KEY)));}catch(e){}}
  hud();resize();
  if(window.ResizeObserver)new ResizeObserver(resize).observe($('stage'));else addEventListener('resize',resize);
  requestAnimationFrame(tick);
}
window.claude?.hot?.snapshot?.(()=>({state:S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
